server:
  port: 8081

spring:
  application:
    name: handys-batch
  datasource:
    url: jdbc:h2:mem:handys-batch;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    redis:
      host: localhost
      port: 6379
      database: 1

handys:
  inventory:
    redis:
      enabled: false
      ping-fail-threshold: 3
      instance-id: batch-1

management:
  endpoints:
    web:
      exposure:
        include: health,info
